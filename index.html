<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balance Digital Familia Morales Araujo</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 1rem;
      background: #f1f5f9;
    }
    h1 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 1rem;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #10b981;
      color: white;
      font-weight: bold;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <h1>Balance Digital Familiar</h1>
  <form id="formulario">
    <label for="nombre">Nombre</label>
    <select id="nombre" required>
      <option value="">Selecciona...</option>
      <option value="Michelle">Michelle</option>
      <option value="Angel">Angel</option>
      <option value="Adrian">Adrian</option>
      <option value="Andrea">Andrea</option>
    </select>

    <label for="dia">Día</label>
    <input type="date" id="dia" required />

    <label for="horas_pantalla">Horas de pantalla</label>
    <input type="number" id="horas_pantalla" min="0" step="0.1" required />

    <label for="que_hice">¿Qué hice?</label>
    <textarea id="que_hice" required></textarea>

    <label for="como_me_senti">¿Cómo me sentí?</label>
    <input type="text" id="como_me_senti" required />

    <label for="que_pude_haber_hecho">¿Qué pude haber hecho en su lugar?</label>
    <textarea id="que_pude_haber_hecho"></textarea>

    <button type="submit">Enviar</button>
  </form>

  <script>
    document.getElementById("formulario").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
        nombre: document.getElementById("nombre").value,
        dia: document.getElementById("dia").value,
        horas_pantalla: document.getElementById("horas_pantalla").value,
        que_hice: document.getElementById("que_hice").value,
        como_me_senti: document.getElementById("como_me_senti").value,
        que_pude_haber_hecho: document.getElementById("que_pude_haber_hecho").value,
      };

      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbzHeW1coEfvrGeJpmeHEHHoLk7YDwXxLVZpUk0m5pACW8mMPngpPMBGWptzwtRfraSd/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const result = await res.json();
        alert("✅ ¡Registro enviado!");
        document.getElementById("formulario").reset();
      } catch (err) {
        alert("❌ Error al enviar. Intenta de nuevo.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
